<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramones YouTube Connector</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #222; padding: 20px; border-radius: 8px; }
        .btn { background: #e60000; color: white; border: none; padding: 10px 15px; margin: 5px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #ff3333; }
        #youtube-player { margin-top: 15px; border: 2px solid #e60000; }
    </style>
</head>
<body>

<div class="container">
    <h2>RAMONES PLAYER (YOUTUBE INTEGRATION)</h2>
    <p>Pilih lagu untuk memutar langsung dari YouTube:</p>

    <!-- Tombol Pemilih Lagu -->
    <button class="btn" onclick="playSong('268C3y2f2kU')">Blitzkrieg Bop</button>
    <button class="btn" onclick="playSong('J4P44BGDqKw')">I Wanna Be Sedated</button>
    <button class="btn" onclick="playSong('HOp8Sut_HkI')">Rockaway Beach</button>

    <!-- Wadah Pemutar Video YouTube (Iframe) -->
    <div id="player-container">
        <iframe id="youtube-player" width="100%" height="250" 
            src="https://www.youtube.com/embed/268C3y2f2kU?enablejsapi=1" 
            frameborder="0" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
        </iframe>
    </div>
</div>

<script>
    // Fungsi untuk mengganti lagu berdasarkan YouTube Video ID
    function playSong(videoId) {
        var iframe = document.getElementById('youtube-player');
        // Mengubah sumber iframe secara langsung dengan parameter enablejsapi=1 & autoplay=1
        iframe.src = "https://www.youtube.com/embed/" + videoId + "?enablejsapi=1&autoplay=1";
    }
</script>

</body>
</html>
